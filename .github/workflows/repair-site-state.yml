name: Repair site state rendering

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix JavaScript startup order
        run: python -c "from pathlib import Path; p=Path('app.js'); s=p.read_text(encoding='utf-8-sig'); old='\\n  populateCaptainCompanySelect();\\n  populateEnlistmentCompanySelect();\\n\\n  function ensureDefaultCommanderAccount()'; s=s.replace(old,'\\n  function ensureDefaultCommanderAccount()',1); marker='\\n  };\\n\\n  const galleryData = window.galleryData || [];'; replacement='\\n  };\\n\\n  populateCaptainCompanySelect();\\n  populateEnlistmentCompanySelect();\\n\\n  const galleryData = window.galleryData || [];'; state_pos=s.find('  const state = {'); call_pos=s.find('  populateCaptainCompanySelect();\\n  populateEnlistmentCompanySelect();',state_pos); s=s.replace(marker,replacement,1) if call_pos < 0 else s; p.write_text(s,encoding='utf-8')"

      - name: Validate JavaScript
        run: node --check app.js

      - name: Verify startup order
        run: python -c "from pathlib import Path; s=Path('app.js').read_text(encoding='utf-8-sig'); a=s.find('  const state = {'); b=s.find('  populateCaptainCompanySelect();\\n  populateEnlistmentCompanySelect();'); assert a>=0 and b>a, 'Startup order still broken'; print('Startup order OK')"

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git diff --cached --quiet && echo 'No changes needed' && exit 0
          git commit -m 'Fix live site JavaScript startup'
          git push
