name: Restore working app.js

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate current full app.js
        run: |
          node --check app.js
          test "$(wc -l < app.js)" -gt 2500
          grep -q 'function renderGallery' app.js
          grep -q 'function saveAppState' app.js
