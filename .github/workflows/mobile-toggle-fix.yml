name: Fix live mobile navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile navigation fix safely
        shell: python
        run: |
          from pathlib import Path
          import re

          css = Path('index.css')
          marker = '/* ROYAL SHEPHERD MOBILE NAV FIX v1 */'
          css_text = css.read_text(encoding='utf-8')

          if marker not in css_text:
              css_text += r'''

          /* ROYAL SHEPHERD MOBILE NAV FIX v1 */
          @media (max-width: 900px) {
            .site-header {
              width: calc(100% - 1rem);
              border-radius: 1.25rem;
            }

            .nav-wrap {
              position: relative;
              min-height: 4.5rem;
              padding: 0.8rem 1rem;
            }

            .menu-toggle {
              display: flex !important;
              position: relative;
              z-index: 1003;
              flex: 0 0 auto;
              align-items: center;
              justify-content: center;
              min-width: 44px;
              min-height: 44px;
              margin-left: auto;
              -webkit-tap-highlight-color: transparent;
              touch-action: manipulation;
              pointer-events: auto !important;
            }

            .site-nav {
              display: none !important;
              position: absolute;
              top: calc(100% + 0.5rem);
              left: 0;
              right: 0;
              z-index: 1002;
              flex-direction: column;
              align-items: stretch;
              gap: 0.35rem;
              padding: 0.75rem;
              border-radius: 1.25rem;
              background: rgba(10, 18, 35, 0.98);
              border: 1px solid rgba(255,255,255,0.14);
              box-shadow: 0 20px 50px rgba(0,0,0,0.35);
              backdrop-filter: blur(18px);
              -webkit-backdrop-filter: blur(18px);
              max-height: calc(100vh - 7rem);
              overflow-y: auto;
              pointer-events: auto;
            }

            .site-nav.mobile-open {
              display: flex !important;
            }

            .site-nav .nav-link {
              display: flex;
              align-items: center;
              width: 100%;
              min-height: 44px;
              padding: 0.7rem 0.85rem;
              border-radius: 0.8rem;
            }

            .site-nav .nav-link::after {
              display: none;
            }

            .site-nav .nav-link:hover,
            .site-nav .nav-link:focus-visible {
              background: rgba(255,255,255,0.08);
            }

            .site-nav .cta-link {
              justify-content: center;
            }

            .brand {
              min-width: 0;
              max-width: calc(100% - 4rem);
            }

            .brand span {
              min-width: 0;
            }

            .brand strong {
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
            }
          }
          '''
              css.write_text(css_text, encoding='utf-8')

          js = Path('app.js')
          js_text = js.read_text(encoding='utf-8')

          start = js_text.find('function bindMobileMenu() {')
          if start == -1:
              raise SystemExit('bindMobileMenu function not found')
          end = js_text.find('\nfunction bindSmoothScrolling()', start)
          if end == -1:
              raise SystemExit('bindSmoothScrolling boundary not found')

          new_function = r'''function bindMobileMenu() {
            if (!menuToggle || !navMenu) return;
            if (menuToggle.dataset.mobileMenuBound === 'true') return;
            menuToggle.dataset.mobileMenuBound = 'true';

            const setOpen = (open) => {
              menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
              navMenu.classList.toggle('mobile-open', open);
            };

            menuToggle.addEventListener('click', (event) => {
              event.preventDefault();
              event.stopPropagation();
              const isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
              setOpen(!isOpen);
            }, { passive: false });

            navMenu.querySelectorAll('a').forEach((link) => {
              link.addEventListener('click', () => setOpen(false));
            });

            document.addEventListener('click', (event) => {
              if (!navMenu.classList.contains('mobile-open')) return;
              if (navMenu.contains(event.target) || menuToggle.contains(event.target)) return;
              setOpen(false);
            });
          }'''
          js_text = js_text[:start] + new_function + js_text[end:]

          # Ensure the binding runs even if a previous initialization block was lost.
          if js_text.count('bindMobileMenu();') == 0:
              js_text += r'''

          // Ensure mobile navigation is initialized on GitHub Pages/mobile browsers.
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bindMobileMenu, { once: true });
          } else {
            bindMobileMenu();
          }
          '''

          js.write_text(js_text, encoding='utf-8')

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.css
          if git diff --cached --quiet; then
            echo "No mobile navigation changes needed"
          else
            git commit -m "Fix mobile navigation toggle on live site"
            git push
          fi
