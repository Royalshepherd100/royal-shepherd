name: Refresh frontend asset cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh frontend cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8-sig')
          match = re.search(r'app\.js\?v=(\d+)', text)
          if not match:
              raise SystemExit('app.js cache reference not found')
          version = int(match.group(1)) + 1
          updated = text[:match.start(1)] + str(version) + text[match.end(1):]
          path.write_text(updated, encoding='utf-8')
          print(f'Bumped app.js cache version to {version}')
          PY

      - name: Validate JavaScript
        run: node --check app.js

      - name: Verify cache refresh
        run: grep -Eq 'app.js\?v=[0-9]+' index.html

      - name: Commit cache refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && echo 'No changes needed' && exit 0
          git commit -m 'Force fresh frontend JavaScript cache'
          git push
