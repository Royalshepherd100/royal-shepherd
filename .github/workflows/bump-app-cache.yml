name: Refresh frontend asset cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh frontend cache version
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8-sig'); old=s; s=s.replace('app.js?v=16','app.js?v=17',1); assert s!=old, 'app.js cache reference not found'; p.write_text(s,encoding='utf-8')"

      - name: Validate JavaScript
        run: node --check app.js

      - name: Verify cache refresh
        run: grep -q 'app.js?v=17' index.html

      - name: Commit cache refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && echo 'No changes needed' && exit 0
          git commit -m 'Refresh frontend app cache'
          git push
