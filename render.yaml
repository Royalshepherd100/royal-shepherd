services:
  - type: static_site
    name: royal-shepherd
    env: static
    branch: main
    plan: starter
    root: .
    publishPath: dist
    buildCommand: node scripts/build-static.js

  - type: web_service
    name: "royal-shepherd-bacl"
    env: python
    branch: main
    plan: starter
    root: backend
    buildCommand: pip install -r requirements/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: RS_DATA_FILE
        value: /var/data/data_store.json
      - key: RS_UPLOAD_DIR
        value: /var/data/uploads
      - key: RS_ADMIN_EMAIL
        sync: false
      - key: RS_ADMIN_PASSWORD
        sync: false
    disk:
      name: royal-shepherd-data
      mountPath: /var/data
      sizeGB: 1
